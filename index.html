<!doctype html>
<html lang="en" class="site-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="M. T. Malinga's cybersecurity and IT portfolio: projects, lab practicals, learning milestones, and PSudo IT Solution."
    />
    <meta name="theme-color" content="#080e16" />
    <title>Malinga Portfolio</title>
    <link
      rel="preload"
      as="image"
      href="/image/cybersecurity-background.webp"
    />
    <style>
      html.site-loading,
      html.site-loading body {
        overflow: hidden;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: radial-gradient(ellipse at 50% 45%, #102a2a, #060e16 65%);
        color: #e6edf6;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
        font-family:
          Segoe UI,
          sans-serif;
      }
      #boot-loader .boot-ring {
        width: clamp(140px, 22vw, 176px);
        height: clamp(140px, 22vw, 176px);
        border: 1px solid #263e3a;
        border-top-color: #7aefba;
        border-radius: 50%;
        margin: 0 auto 36px;
        animation: boot-spin 1.5s linear infinite;
      }
      #boot-loader small {
        color: #7aefba;
        letter-spacing: 0.18em;
        font-size: clamp(13px, 2.5vw, 15px);
      }
      #boot-loader p {
        font-size: clamp(28px, 6vw, 42px);
        margin: 14px 0;
        line-height: 1.2;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .boot-ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Loading portfolio">
      <div>
        <div class="boot-ring" aria-hidden="true"></div>
        <small>M.T. MALINGA</small>
        <p>Loading portfolio…</p>
      </div>
    </div>
    <div id="root"></div>
    <noscript
      ><style>
        #boot-loader {
          display: none;
        }
        html.site-loading,
        html.site-loading body {
          overflow: auto;
        }
      </style>
      <p style="color: #e6edf6; background: #060e16; padding: 24px">
        Please enable JavaScript to view this React portfolio.
      </p></noscript
    >
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
